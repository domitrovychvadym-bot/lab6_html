<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Лабораторна робота №6 — Варіант 7</title>
</head>
<body>
    <h3>Лабораторна робота №6. Варіант №7</h3>

    <svg version="1.1" 
         baseProfile="full" 
         xmlns="http://www.w3.org/2000/svg" 
         xmlns:xlink="http://www.w3.org/1999/xlink" 
         width="600px" height="450px">

        <!-- 2. ТЕКСТ ПО КРИВІЙ (10%) -->
        <defs>
            <path id="textCurve" d="M 60,50 Q 300,10 540,50" />
        </defs>
        <text font-size="16" fill="black" font-weight="bold">
            <textPath xlink:href="#textCurve" startOffset="50%" text-anchor="middle">
                SVG Графіка — Варіант №7
            </textPath>
        </text>

        <!-- 1. СТАТИЧНЕ ЗОБРАЖЕННЯ: КООРДИНАТНІ ОСІ ТА ЗАСІЧКИ (40%) -->
        <!-- Вісь X -->
        <line x1="100" y1="250" x2="500" y2="250" stroke="black" stroke-width="2" />
        <line x1="500" y1="250" x2="490" y2="245" stroke="black" stroke-width="2" />
        <line x1="500" y1="250" x2="490" y2="255" stroke="black" stroke-width="2" />
        <text x="510" y="255" font-size="14" font-weight="bold">X</text>

        <!-- Вісь Y -->
        <line x1="200" y1="390" x2="200" y2="70" stroke="black" stroke-width="2" />
        <line x1="200" y1="70" x2="195" y2="80" stroke="black" stroke-width="2" />
        <line x1="200" y1="70" x2="205" y2="80" stroke="black" stroke-width="2" />
        <text x="195" y="60" font-size="14" font-weight="bold">Y</text>

        <!-- Засічки та цифри на осі X (0, 1, 2, 3, 4, 5) -->
        <text x="185" y="270" font-size="12">0</text>

        <line x1="250" y1="245" x2="250" y2="255" stroke="black" stroke-width="1.5" />
        <text x="247" y="270" font-size="12">1</text>

        <line x1="300" y1="245" x2="300" y2="255" stroke="black" stroke-width="1.5" />
        <text x="297" y="270" font-size="12">2</text>

        <line x1="350" y1="245" x2="350" y2="255" stroke="black" stroke-width="1.5" />
        <text x="347" y="270" font-size="12">3</text>

        <line x1="400" y1="245" x2="400" y2="255" stroke="black" stroke-width="1.5" />
        <text x="397" y="270" font-size="12">4</text>

        <line x1="450" y1="245" x2="450" y2="255" stroke="black" stroke-width="1.5" />
        <text x="447" y="270" font-size="12">5</text>

        <!-- Засічки та цифри на осі Y (-2, -1, 1, 2) -->
        <line x1="195" y1="350" x2="205" y2="350" stroke="black" stroke-width="1.5" />
        <text x="175" y="354" font-size="12">-2</text>

        <line x1="195" y1="300" x2="205" y2="300" stroke="black" stroke-width="1.5" />
        <text x="175" y="304" font-size="12">-1</text>

        <line x1="195" y1="200" x2="205" y2="200" stroke="black" stroke-width="1.5" />
        <text x="183" y="204" font-size="12">1</text>

        <line x1="195" y1="150" x2="205" y2="150" stroke="black" stroke-width="1.5" />
        <text x="183" y="154" font-size="12">2</text>


        <!-- 3. ГРАФІЧНІ ФІГУРИ ТА АНІМАЦІЇ ВАРІАНТА №7 -->

        <!-- 3.1. Зміна кольору (10%): Великий центральний еліпс -->
        <ellipse cx="350" cy="175" rx="75" ry="35" fill="blue" stroke="black" stroke-width="1.5">
            <animate attributeName="fill" 
                     values="blue; red; green; yellow; blue" 
                     dur="4s" 
                     repeatCount="indefinite" />
        </ellipse>

        <!-- 3.2. Переміщення (10%): Ліве коло під еліпсом -->
        <circle cx="250" cy="285" r="35" fill="blue" stroke="black" stroke-width="1.5">
            <animateTransform attributeName="transform" 
                              type="translate" 
                              values="0,0; 0,-15; 0,0" 
                              dur="2s" 
                              repeatCount="indefinite" />
        </circle>

        <!-- Праве коло під еліпсом (статичне) -->
        <circle cx="350" cy="285" r="35" fill="blue" stroke="black" stroke-width="1.5" />

        <!-- 3.3. Обертання (10%): Верхній лівий квадрат -->
        <rect x="200" y="100" width="40" height="40" fill="blue" stroke="black" stroke-width="1.5">
            <animateTransform attributeName="transform" 
                              type="rotate" 
                              from="0 220 120" 
                              to="360 220 120" 
                              dur="3s" 
                              repeatCount="indefinite" />
        </rect>

        <!-- 3.4. Зміна розміру (10%): Нижній прямокутник -->
        <rect x="280" y="335" width="90" height="40" fill="blue" stroke="black" stroke-width="1.5">
            <animateTransform attributeName="transform" 
                              type="scale" 
                              values="1; 1.2; 1" 
                              transform-origin="325 355" 
                              dur="2.5s" 
                              repeatCount="indefinite" />
        </rect>

        <!-- 3.5. Перекручування / нахил (10%): Верхній правий квадрат -->
        <rect x="360" y="100" width="40" height="40" fill="blue" stroke="black" stroke-width="1.5">
            <animateTransform attributeName="transform" 
                              type="skewX" 
                              values="0; 30; -30; 0" 
                              dur="3s" 
                              repeatCount="indefinite" />
        </rect>

        <!-- Статичні квадрати (згідно з кресленням варіанта 7) -->
        <!-- Середній лівий квадрат -->
        <rect x="160" y="155" width="40" height="40" fill="blue" stroke="black" stroke-width="1.5" />

        <!-- Середній правий квадрат -->
        <rect x="440" y="155" width="40" height="40" fill="blue" stroke="black" stroke-width="1.5" />

        <!-- Нижній лівий квадрат -->
        <rect x="160" y="265" width="40" height="40" fill="blue" stroke="black" stroke-width="1.5" />

        <!-- Нижній правий квадрат -->
        <rect x="440" y="265" width="40" height="40" fill="blue" stroke="black" stroke-width="1.5" />

    </svg>
</body>
</html>
